aid: radai
name: Rad AI
description: >-
  Rad AI is a San Francisco based healthcare technology company that builds
  generative and machine-learning software for radiology. Its products help
  radiologists work faster and reduce burnout: Rad AI Reporting is a generative
  AI reporting platform, Rad AI Impressions automatically generates customized
  report impressions (reported to save radiologists 60+ minutes per shift), and
  Rad AI Continuity manages follow-up of incidental findings. The company is
  SOC 2 Type II and HIPAA certified and is backed by Khosla Ventures. Rad AI
  markets its clinical products directly to health systems and imaging groups
  and does not currently publish a public developer API, developer portal, or
  SDKs; this profile captures its identity, security posture, and compliance
  program for the API Evangelist network.
